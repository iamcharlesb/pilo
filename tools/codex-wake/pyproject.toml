[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-wake"
version = "0.1.0"
description = "Durable observer events and timeout wakeups for Codex over MCP"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
codex-wake = "codex_wake.__main__:main"

[tool.setuptools.packages.find]
include = ["codex_wake*"]

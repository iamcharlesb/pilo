name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime:
    name: Pilo Runtime (Build, Secret Scan & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint

  browser-agent:
    name: Pilo Desktop & Bot Runtime (Secret Scan & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix node/browser_agent ci
      - run: npx --prefix node/browser_agent playwright install --with-deps chromium
      - run: npm --prefix node/browser_agent test

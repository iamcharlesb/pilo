<p class="caption">Fifteen little personalities. One happy place.</p>
<div class="controls expression-controls" role="group" aria-label="Character expression">
<button data-expression="idle" aria-pressed="true">Original</button>
<button data-expression="thinking" aria-pressed="false">Thinking</button>
<button data-expression="writing" aria-pressed="false">Writing</button>
<button data-expression="sad" aria-pressed="false">Sad</button>
<button data-expression="happy" aria-pressed="false">Happy</button>
</div>
<div class="controls" aria-label="Animation controls">
<button id="pause" aria-pressed="false">Pause animation</button>
<button id="celebrate" class="primary">✦ Everyone, dance!</button>
<label class="speed-control" for="speed">Tempo <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><output id="tempo" for="speed">1×</output></label>
</div>
<p class="hint">Tap a friend to say hello · Space to pause</p>
<p id="announcement" role="status" aria-live="polite" style="position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden"></p>
</main>
<script>
const scene = document.querySelector('.scene');
const pauseButton = document.querySelector('#pause');
const danceButton = document.querySelector('#celebrate');
const speedInput = document.querySelector('#speed');
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
let paused = motionPreference.matches;
let partyTimer;
const activeAnimations = new Map();
const expressionCaptions = {
  idle: 'Fifteen little personalities. One happy place.',
  thinking: 'A little curiosity. A big idea on the way.',
  writing: 'Heads down. Bringing little ideas to life.',
  sad: 'Some days call for a little extra kindness.',
  happy: 'Good company. Very happy little hearts.'
};
function setExpression(expression) {
  if (!Object.hasOwn(expressionCaptions, expression)) return;
  clearTimeout(partyTimer);
  scene.classList.remove('celebrating');
  activeAnimations.forEach(animation => animation.cancel());
  activeAnimations.clear();
  scene.dataset.expression = expression;
  document.querySelectorAll('.expression-controls button').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.expression === expression));
  });
  document.querySelector('.caption').textContent = expressionCaptions[expression];
  document.querySelector('#announcement').textContent = `All fifteen friends are ${expression === 'idle' ? 'back to their original expressions' : expression}.`;
}
document.querySelectorAll('.expression-controls button').forEach(button => {
  button.addEventListener('click', () => setExpression(button.dataset.expression));
});
function renderPlayback() {
  document.body.classList.toggle('paused', paused);
  pauseButton.textContent = paused ? 'Play animation' : 'Pause animation';
  pauseButton.setAttribute('aria-pressed', String(paused));
  activeAnimations.forEach(animation => paused ? animation.pause() : animation.play());
}
function syncMotionPreference() {
  document.body.classList.toggle('reduced', motionPreference.matches);
  paused = motionPreference.matches;
  renderPlayback();
}
syncMotionPreference();
motionPreference.addEventListener('change', syncMotionPreference);
pauseButton.addEventListener('click', () => { paused = !paused; renderPlayback(); });
speedInput.addEventListener('input', () => {
  document.documentElement.style.setProperty('--speed', speedInput.value);
  document.querySelector('#tempo').value = `${speedInput.value}×`;
});
function greet(character) {
  document.querySelector('#announcement').textContent = `${character.querySelector('title').textContent} says hello!`;
  if (motionPreference.matches || paused) return;
  activeAnimations.get(character)?.cancel();
  const animation = character.animate([
    {transform:'translateY(0) rotate(0deg)'},
    {transform:'translateY(-32px) rotate(-7deg)',offset:.4},
    {transform:'translateY(-8px) rotate(5deg)',offset:.75},
    {transform:'translateY(0) rotate(0deg)'}
  ], {duration:850, easing:'ease-in-out'});
  activeAnimations.set(character, animation);
  animation.onfinish = () => activeAnimations.delete(character);
}
document.querySelectorAll('.character').forEach(character => {
  character.addEventListener('click', () => greet(character));
  character.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {event.preventDefault(); greet(character);}
  });
});
danceButton.addEventListener('click', () => {
  setExpression('happy');
  document.querySelector('#announcement').textContent = 'The whole Pilo crew says hello!';
  if (motionPreference.matches) return;
  paused = false; renderPlayback();
  clearTimeout(partyTimer);
  scene.classList.remove('celebrating');
  void scene.getBoundingClientRect();
  scene.classList.add('celebrating');
  partyTimer = setTimeout(() => scene.classList.remove('celebrating'), 1950);
  const bounds = scene.getBoundingClientRect();
  for (let i = 0; i < 36; i++) {
    const spark = document.createElement('span');
    spark.className = 'spark';
    spark.style.left = `${bounds.left + bounds.width / 2 + scrollX}px`;
    spark.style.top = `${bounds.top + bounds.height * .45 + scrollY}px`;
    spark.style.background = ['#1687ff','#b469f5','#ff4dce','#a0e944','#ffcd35'][i % 5];
    spark.style.setProperty('--x', `${(Math.random() - .5) * Math.min(innerWidth, 850)}px`);
    spark.style.setProperty('--y', `${(Math.random() - .6) * 500}px`);
    document.body.append(spark);
    spark.addEventListener('animationend', () => spark.remove(), {once:true});
  }
});
scene.addEventListener('pointermove', event => {
  if (motionPreference.matches || paused) return;
  const bounds = scene.getBoundingClientRect();
  const x = ((event.clientX - bounds.left) / bounds.width - .5) * 6;
  const y = ((event.clientY - bounds.top) / bounds.height - .5) * 5;
  scene.querySelectorAll('.gaze').forEach(eye => eye.style.translate = `${x}px ${y}px`);
});
scene.addEventListener('pointerleave', () => scene.querySelectorAll('.gaze').forEach(eye => eye.style.translate = '0px 0px'));
document.addEventListener('keydown', event => {
  if (event.code === 'Space' && event.target === document.body) {
    event.preventDefault(); paused = !paused; renderPlayback();
  }
});
</script>
